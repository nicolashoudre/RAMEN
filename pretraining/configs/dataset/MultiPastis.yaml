defaults:
  - train_transform: Identity
  - test_transform: Identity
  - _self_

name: multipastis
global_batch_size: ${global_batch_size}
num_classes: 20
nb_split: 4
height: 32
width: 32
classif: False
len: 1455
norm_path: ${data_dir}/PASTIS-R/
temporal_dropout: 20

train_dataset:
  _partial_: true
  _target_: data.MultiDataset.MultiDataset
  datasets:
    pastis:
      _target_: data.Pastis.PASTIS
      path: ${data_dir}/PASTIS-R/
      modalities: ${modalities.pastis}
      transform: ${dataset.train_transform}
      reference_date: "2018-09-01"
      folds: [1, 2, 3]
      nb_split: ${dataset.nb_split}
      classif: ${dataset.classif}
      norm_path: ${dataset.norm_path}
      split: train
      temporal_dropout: ${dataset.temporal_dropout}

val_dataset:
  _partial_: true
  _target_: data.MultiDataset.MultiDataset
  datasets:
    pastis:
      _target_: data.Pastis.PASTIS
      path: ${data_dir}/PASTIS-R/
      modalities: ${modalities.pastis}
      transform: ${dataset.train_transform}
      reference_date: "2018-09-01"
      folds: [4]
      nb_split: ${dataset.nb_split}
      classif: ${dataset.classif}
      norm_path: ${dataset.norm_path}
      split: val
      temporal_dropout: ${dataset.temporal_dropout}

test_dataset:
  _partial_: true
  _target_: data.MultiDataset.MultiDataset
  datasets:
    pastis:
      _target_: data.Pastis.PASTIS
      path: ${data_dir}/PASTIS-R/
      modalities: ${modalities.pastis}
      transform: ${dataset.train_transform}
      reference_date: "2018-09-01"
      folds: [5]
      nb_split: ${dataset.nb_split}
      classif: ${dataset.classif}
      norm_path: ${dataset.norm_path}
      split: test
      temporal_dropout: ${dataset.temporal_dropout}