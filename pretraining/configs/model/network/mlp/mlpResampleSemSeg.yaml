defaults:
  - activation: gelu
  - norm: batchnorm #instance_1d #groupnorm

instance:
  _target_: models.networks.mlp.MLPResampleSemSeg
  initial_dim: ${model.network.instance.embed_dim}
  hidden_dim:
    - 128
    - 64
  final_dim: ${dataset.num_classes}
  norm: ${model.network.mlp.norm}
  activation: ${model.network.mlp.activation}
  patch_size: ${model.network.instance.patch_size}
  res: ${res}
  mask_res: 1.0
  num_iterations: ${model.network.instance.num_iterations}
  